name: Windows release

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - name: Build Windows installer and stage release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis --ci -- --locked
          tagName: v__VERSION__
          releaseName: Notes __VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          releaseBody: |
            Windows x64 installer: download the file ending in `-setup.exe`.

            - Structure only: local System One decisions add Markdown markers without rewriting note content; review the preview before Apply.
            - Independent decision model setting, source-preserving Apply/Undo and native request cancellation.
            - Simpler Settings, configurable Markdown marker opacity (default 55%), and removed frosted-glass experiment.
            - New Notes logo included in the application, taskbar icon, installer and browser favicon.
            - Includes the formula editing and streamed autocomplete fixes merged since 0.1.1.

            Structure only requires Ollama >= 0.35 and compatible GGUF weights. Install manually: `ollama pull tev1:0.8b-q8_0` (alternative: `tev1:4b-q4_K_M`). Real model quality has not been benchmarked; the 0.8B model is a candidate, not a validated recommendation.

            Configure local Ollama models in Settings → Notes. No model weights are bundled. The installer includes the scientific Python runtime. This build is unsigned.
      - name: Add checksum and publish completed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:APP_VERSION"
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $installer = $installers[0]
          if ($installer.Length -lt 1MB) { throw 'Installer is unexpectedly small.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content SHA256SUMS.txt -Encoding ascii
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify staged release.' }
          if ($installer.Name -notin $release.assets.name) { throw 'Installer upload is missing.' }
          Copy-Item 'public/logo.png' Notes-logo.png
          $logoHash = (Get-FileHash Notes-logo.png -Algorithm SHA256).Hash.ToLower()
          "$logoHash  Notes-logo.png" | Add-Content SHA256SUMS.txt -Encoding ascii
          gh release upload $tag SHA256SUMS.txt Notes-logo.png --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Logo/checksum upload failed.' }
          $completed = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify completed release.' }
          foreach ($required in @($installer.Name, 'Notes-logo.png', 'SHA256SUMS.txt')) {
            if ($required -notin $completed.assets.name) { throw "Missing release asset: $required" }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
